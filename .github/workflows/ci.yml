name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --frozen
      - name: Test
        run: uv run pytest -q

  # The claim this repository makes is that the protocol can be spoken by
  # something that is not this codebase. That is worth nothing as an
  # assertion in a README, so it is checked on every change: build the C++
  # client, confirm it links no third-party library, and drive a server that
  # grades it against SPEC.md clause by clause.
  cross-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --frozen

      # No -Werror: a newer compiler finding a new warning should be visible
      # in the log, not a red build on a change that did not cause it.
      - name: Build the C++ reference client
        run: >
          g++ -std=c++17 -O2 -Wall -Wextra
          -o /tmp/plugrl_client examples/plugrl_client.cpp

      - name: It links nothing but the C++ and C runtimes
        run: |
          ldd /tmp/plugrl_client
          if ldd /tmp/plugrl_client | grep -vE \
              'linux-vdso|libstdc\+\+|libgcc_s|libc\.so|libm\.so|ld-linux'; then
            echo "::error::the client picked up a third-party dependency"
            exit 1
          fi

      - name: C++ client conforms to SPEC.md
        run: |
          uv run --with websockets examples/conformance_server.py \
            --port 8765 --steps 10 --horizon 4 --action-dim 7 --timeout 120 &
          server=$!
          for _ in $(seq 30); do
            (echo > /dev/tcp/127.0.0.1/8765) 2>/dev/null && break
            sleep 1
          done
          /tmp/plugrl_client 127.0.0.1 8765 10
          wait $server

      # The action dtype is the environment's and is never renegotiated, so a
      # client has to read the typestr. A client that hard-codes float32 still
      # passes every clause the server can see - it sends valid messages - and
      # only misreads what comes back. This is the check that catches it: the
      # server sends float64 actions whose values encode the horizon position,
      # so the client's own output says whether it decoded them.
      - name: ... and reads the action typestr rather than assuming float32
        run: |
          uv run --with websockets examples/conformance_server.py \
            --port 8766 --steps 3 --horizon 2 --action-dim 3 \
            --action-dtype float64 --timeout 120 &
          server=$!
          for _ in $(seq 30); do
            (echo > /dev/tcp/127.0.0.1/8766) 2>/dev/null && break
            sleep 1
          done
          /tmp/plugrl_client 127.0.0.1 8766 3 | tee /tmp/out.txt
          wait $server
          grep -q 'dtype=<f8' /tmp/out.txt
          # Time-major [H, n, da] with action[t, :, 0] = t, so the first six
          # values of a (2, 1, 3) chunk are 0 0 0 then 1 0 0.
          grep -q 'first values: 0 0 0 1 0 0' /tmp/out.txt

      - name: Python reference client conforms to SPEC.md
        run: |
          uv run --with websockets examples/conformance_server.py \
            --port 8767 --steps 10 --horizon 3 --action-dim 5 --timeout 120 &
          server=$!
          for _ in $(seq 30); do
            (echo > /dev/tcp/127.0.0.1/8767) 2>/dev/null && break
            sleep 1
          done
          uv run --with websockets examples/raw_client.py \
            --host 127.0.0.1 --port 8767 --steps 10
          wait $server
