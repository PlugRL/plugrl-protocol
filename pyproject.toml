[project]
name = "plugrl-protocol"
version = "0.1.0"
description = "PlugRL wire protocol: message types and msgpack-numpy serialization."
authors = [
    {name = "chenhao lu",email = "luch21@mails.tsinghua.edu.cn"}
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "numpy (<2.3.3)",
    "msgpack (>=1.1.1,<2.0.0)",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["plugrl_protocol*"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
